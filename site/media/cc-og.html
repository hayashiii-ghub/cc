<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>cc: social image</title>
  <link rel="stylesheet" href="../src/styles/shelf.css">
  <link rel="icon" href="../public/cc/cc-favicon.svg" type="image/svg+xml">
  <script type="module" src="./cc-og.ts"></script>
  <style>
  @font-face { font-family: OGSerif; src: url('/cc/instrument-serif-latin.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: OGSans; src: url('/cc/geist-latin.woff2') format('woff2'); font-weight: 100 900; }
  * { box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
  body { background: #030304; color: #f2f0eb; font-family: OGSans, sans-serif; -webkit-font-smoothing: antialiased; }
  .og-artwork { position: relative; width: 1200px; height: 630px; overflow: hidden; }
  .og-brand { position: absolute; top: 24px; left: 46px; height: 44px; font: 400 42px/1 OGSerif, serif; }
  .og-brand img { width: 64px; height: 44px; object-fit: contain; }
  .og-artwork h1 { position: absolute; top: 84px; left: 48px; margin: 0; font: 400 68px/1.08 OGSerif, serif; letter-spacing: -.025em; }
  .og-product.preview { position: absolute; top: 180px; left: 28px; right: 28px; width: auto; margin: 0; }

  .og-product .desktopShelf { width: 430px; right: 38px; }
  .og-product .shelfHeader { height: 48px; }
  .og-product .itemList { min-height: 226px; }
  .og-product .itemRow { min-height: 70px; }
  .og-product .shelfFooter { min-height: 50px; }
</style>
</head>
<body><main class="og-artwork">
  <div class="og-brand"><img src="../public/cc/cc-mark.svg" width="64" height="44" alt="cc:"></div>
  <h1>A shared shelf for AI</h1>
  <figure class="og-product preview"></figure>
</main></body>
</html>
