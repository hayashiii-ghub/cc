<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1200, initial-scale=1">
    <title>cc: social image</title>
    <style>
      @font-face {
        font-family: "CC Serif";
        src: url("../public/cc/instrument-serif-latin.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "CC Sans";
        src: url("../public/cc/geist-latin.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "CC Mono";
        src: url("../public/cc/jetbrains-mono-latin.woff2") format("woff2");
        font-weight: 100 800;
      }
      * { box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
      body {
        background: #030304;
        color: #f2f0eb;
        font-family: "CC Sans", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .frame {
        position: absolute;
        inset: 24px;
        overflow: hidden;
        border: 1px solid rgba(242, 240, 235, 0.1);
        border-radius: 30px;
        background: radial-gradient(ellipse at 78% 50%, #080e11 0, #030304 66%);
      }
      .brand {
        position: absolute;
        left: 48px;
        top: 43px;
        display: flex;
        align-items: center;
        gap: 20px;
        font-size: 23px;
        font-weight: 500;
        letter-spacing: -0.03em;
      }
      .brand img { width: 36px; height: 36px; }
      h1 {
        position: absolute;
        left: 47px;
        top: 151px;
        margin: 0;
        font: 400 74px/1.01 "CC Serif", Georgia, serif;
        letter-spacing: -0.045em;
      }
      .description {
        position: absolute;
        left: 47px;
        top: 331px;
        margin: 0;
        color: #a3a29e;
        font-size: 16px;
        line-height: 1.5;
      }
      .meta {
        position: absolute;
        left: 47px;
        top: 391px;
        margin: 0;
        color: #73736f;
        font: 400 10px/1.4 "CC Mono", monospace;
        letter-spacing: 0.14em;
      }
      .product {
        position: absolute;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        top: 50px;
        right: 23px;
        width: 500px;
        height: 480px;
        overflow: hidden;
        border: 1px solid rgba(242, 240, 235, 0.1);
        border-radius: 28px;
        background: #08090a;
      }
      .shelf { width: 360px; background: #252525; color: #f3f3f3; border: 1px solid #444; border-radius: 14px; box-shadow: 0 20px 50px #0009; overflow: hidden; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; }
      .shelf header { height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid #ffffff12; }
      .shelf header strong { font-weight: 500; }
      .shelf header small { color: #aaa; }
      .shelf header span { margin-left: auto; color: #aaa; letter-spacing: 8px; }
      .shelf ul { list-style: none; margin: 0; padding: 8px; }
      .shelf li { height: 68px; display: flex; align-items: center; gap: 12px; padding: 8px; }
      .file { display: grid; place-items: center; width: 28px; height: 34px; flex: 0 0 auto; border: 1px solid #8b8b8b; border-radius: 4px; color: #bbb; font-size: 8px; }
      .shelf li b { display: block; font-size: 13px; font-weight: 400; }
      .shelf li small { display: block; margin-top: 4px; color: #aaa; font-size: 11px; }
      .shelf li em { margin-left: auto; font-style: normal; color: #999; }
      .shelf footer { height: 48px; padding: 0 16px; display: flex; align-items: center; gap: 20px; border-top: 1px solid #ffffff12; color: #ddd; font-size: 12px; }
      .shelf footer span:last-child { margin-left: auto; color: #aaa; }
      .preview-note { position: absolute; bottom: 36px; margin: 0; color: #73736f; font-size: 11px; }
      .badge {
        position: absolute;
        right: 45px;
        bottom: 27px;
        margin: 0;
        padding: 8px 14px;
        border: 1px solid rgba(242, 240, 235, 0.12);
        border-radius: 999px;
        background: #080a0b;
        color: #b8b7b1;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <div class="brand"><img src="../public/cc/cc-mark.svg" alt="cc:"></div>
      <h1>A copy for<br>what’s next.</h1>
      <p class="description">Files, links, and notes.<br>Ready for your next app or agent.</p>
      <p class="meta">FREE · OPEN SOURCE · LOCAL-FIRST</p>
      <figure class="product">
        <div class="shelf" aria-label="cc: shelf with sample items">
          <header><strong>cc:</strong><small>3 items</small><span>··· ×</span></header>
          <ul>
            <li><span class="file">PDF</span><div><b>Project brief.pdf</b><small>PDF document · You</small></div><em>···</em></li>
            <li><span class="file">MD</span><div><b>Review notes.md</b><small>Markdown · Codex</small></div><em>···</em></li>
            <li><span class="file">Aa</span><div><b>A few things for the next step.</b><small>Text · Claude Code</small></div><em>···</em></li>
          </ul>
          <footer><span>Add files…</span><span>Paste</span><span>Drag files</span></footer>
        </div>
        <p class="preview-note">SAMPLE ITEMS · LOCAL TO YOUR MAC</p>
      </figure>
      <p class="badge">Built for macOS</p>
    </main>
  </body>
</html>
