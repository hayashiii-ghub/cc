name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build and validate scripts
        run: make check

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install site dependencies
        run: bun install --frozen-lockfile

      - name: Audit site dependencies
        run: bun audit --audit-level=high

      - name: Check site types
        run: bun run check

      - name: Test site
        run: bun run test
