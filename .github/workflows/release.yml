name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select full Xcode if available
        run: |
          XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort | tail -n 1 || true)"
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcode-select -p

      - name: Configure optional notarization
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          missing_names=""
          for name in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD NOTARY_KEY_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              missing_names="$missing_names $name"
            fi
          done

          if [ -n "$missing_names" ]; then
            echo "Notarization disabled; missing GitHub secrets:$missing_names"
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/cc-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"

          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | \
            sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' | head -n 1)"
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity found in imported certificate" >&2
            exit 1
          fi

          echo "CC_CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

          printf '%s' "$NOTARY_KEY_BASE64" | base64 -D > "$NOTARY_KEY_PATH"
          chmod 600 "$NOTARY_KEY_PATH"

          echo "CC_NOTARIZE=1" >> "$GITHUB_ENV"
          echo "CC_NOTARY_KEY_PATH=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"
          echo "CC_NOTARY_KEY_ID=$NOTARY_KEY_ID" >> "$GITHUB_ENV"
          echo "CC_NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Build distributable packages
        env:
          CC_UNIVERSAL: "1"
          CC_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0' }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: ./script/package.sh

      - name: Verify bundle version
        env:
          EXPECTED_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0' }}
        run: |
          EXPECTED_VERSION="${EXPECTED_VERSION#v}"
          ACTUAL_VERSION="$(plutil -extract CFBundleShortVersionString raw dist/package/cc.app/Contents/Info.plist)"
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-macos
          path: |
            dist/cc-macos.dmg
            dist/cc-macos.zip
            script/install_latest.sh

      - name: Upload GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release view "$TAG_NAME" >/dev/null 2>&1 || \
            gh release create "$TAG_NAME" --title "$TAG_NAME" --notes "cc: for macOS."
          assets=(dist/cc-macos.dmg dist/cc-macos.zip script/install_latest.sh)
          if [[ -f dist/appcast.xml ]]; then
            assets+=(dist/appcast.xml)
          else
            echo "Warning: dist/appcast.xml was not generated; in-app updates need SPARKLE_ED_PRIVATE_KEY"
          fi
          gh release upload "$TAG_NAME" "${assets[@]}" --clobber
